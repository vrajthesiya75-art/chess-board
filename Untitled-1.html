<html>
  <head>
    <style>

      
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        
      }

     
      .chessboard {
        display: grid;
        grid-template-columns: repeat(8,1fr);
        min-height: 90vh;
        min-width: 90vw;
        max-width: 500vw;
        max-height: 500vh;
      }
      .box {
        height: 100%;
        width: 100%;
      }

      .white {
        background-color: white;
        border: 1px solid black;
       
      }
      .black {
        background-color: black;
        border: 1px solid black;
    }
     

    </style>
  </head>
  <body>
    <div class="chessboard">
      <!-- 1 row -->

      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>

      <!-- 2 row -->

      
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>

      <!-- 3 row -->

      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>

      <!-- 4 row -->

      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>


      <!-- 5 row -->

      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>

      <!-- 6 row -->

      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>


      <!-- 7 row -->

      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>

      <!-- 8 row -->

      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>
      <div class="box black"></div>
      <div class="box white"></div>

    </div>
  </body>
</html>
